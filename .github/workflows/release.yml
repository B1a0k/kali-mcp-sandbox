name: Build and verify release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version, e.g. 0.1.1
        required: true
      kali_base:
        description: Official kalilinux/kali-rolling@sha256 digest
        required: true
        default: kalilinux/kali-rolling@sha256:c717f201f29a7e0a9126c0d51bd08aa7194ac82f53c57314339182f92b0b1585
      platforms:
        description: JSON platform array; each requires its real VM runner
        required: true
        default: '["windows-x86_64"]'
permissions:
  contents: read
concurrency:
  group: kali-release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.matrix.outputs.images }}
      vms: ${{ steps.matrix.outputs.vms }}
    steps:
      - id: matrix
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.kali_base }}
          PLATFORMS: ${{ inputs.platforms }}
        shell: python
        run: |
          import os,json,re
          assert re.fullmatch(r'[A-Za-z0-9.-]+',os.environ['VERSION'])
          assert re.fullmatch(r'kalilinux/kali-rolling@sha256:[0-9a-f]{64}',os.environ['BASE'])
          selected=json.loads(os.environ['PLATFORMS'])
          mapping={
            'windows-x86_64':dict(runner='windows-kali-whp',arch='amd64',exe='msb-windows-x86_64.exe',fw='libkrunfw-windows-x86_64.dll'),
            'linux-x86_64':dict(runner='linux-kali-kvm',arch='amd64',exe='msb-linux-x86_64',fw='libkrunfw-linux-x86_64.so'),
            'darwin-aarch64':dict(runner='macos-kali-hvf',arch='arm64',exe='msb-darwin-aarch64',fw='libkrunfw-darwin-aarch64.dylib')}
          assert isinstance(selected,list) and selected and len(set(selected))==len(selected)
          vms=[dict(platform=p,**mapping[p]) for p in selected]
          images=[dict(arch=a,runner='ubuntu-24.04' if a=='amd64' else 'ubuntu-24.04-arm') for a in sorted({v['arch'] for v in vms})]
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('images='+json.dumps({'include':images})+'\n')
            f.write('vms='+json.dumps({'include':vms})+'\n')
  images:
    needs: plan
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.images) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build and test guest
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ inputs.kali_base }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir release source-release
          python scripts/service_bundle.py --output release/guest-service.py --version "$VERSION"
          docker build --build-arg "KALI_BASE=$BASE" -t "kali-mcp-sandbox:$VERSION-$ARCH" image
          python scripts/docker_smoke.py --image "kali-mcp-sandbox:$VERSION-$ARCH" | tee "release/docker-smoke-$ARCH.log"
          python scripts/shared_smoke.py --image "kali-mcp-sandbox:$VERSION-$ARCH" | tee "release/shared-smoke-$ARCH.log"
          docker save "kali-mcp-sandbox:$VERSION-$ARCH" -o "release/kali-core-$ARCH.tar"
          docker run --rm --entrypoint cat "kali-mcp-sandbox:$VERSION-$ARCH" /usr/share/kali-mcp-package-versions.txt > "release/packages-$ARCH.txt"
          mkdir sources
          docker run --rm --user 0:0 --cpus 2 --memory 1g -v "$PWD/sources:/sources" -v "$PWD/scripts/collect_sources.py:/collect.py:ro" --entrypoint python3 "kali-mcp-sandbox:$VERSION-$ARCH" /collect.py
          tar -czf "source-release/kali-sources-$ARCH.tar.gz" -C sources .
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: release/*
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: sources-${{ matrix.arch }}
          path: source-release/*
          retention-days: 7
          compression-level: 0
  runtimes:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python - <<'PY'
          import os,json,subprocess
          selected=json.loads(os.environ['PLATFORMS'])
          subprocess.run(['python','scripts/release.py','runtime','--output','release',*[x for p in selected for x in ('--platform',p)]],check=True)
          PY
      - name: Preserve runtime licenses and corresponding sources
        run: |
          mkdir source-release
          cp licenses/* source-release/
          curl --fail --location --retry 3 https://codeload.github.com/superradcompany/microsandbox/tar.gz/refs/tags/v0.7.7 -o source-release/microsandbox-0.7.7-source.tar.gz
          curl --fail --location --retry 3 https://codeload.github.com/superradcompany/libkrunfw/tar.gz/21f169f7e94798c8916315f8ac6f5999d5b88566 -o source-release/libkrunfw-21f169f-source.tar.gz
          curl --fail --location --retry 3 https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.111.tar.gz -o source-release/linux-6.12.111.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: runtimes
          path: release/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-sources
          path: source-release/*
          compression-level: 0
  vm:
    needs: [plan, images, runtimes]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.vms) }}
    runs-on: [self-hosted, '${{ matrix.runner }}']
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download release inputs with resume and retry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARTIFACT: image-${{ matrix.arch }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $headers = @(
            '--header', "Authorization: Bearer $env:GH_TOKEN",
            '--header', 'Accept: application/vnd.github+json',
            '--header', 'X-GitHub-Api-Version: 2022-11-28'
          )
          $artifactsUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100"
          $artifactsJson = & curl.exe --silent --show-error --fail --location --connect-timeout 20 --retry 6 --retry-all-errors @headers $artifactsUrl
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to list workflow artifacts'
          }
          $artifacts = ($artifactsJson | ConvertFrom-Json).artifacts
          foreach ($artifact in @('runtimes', $env:IMAGE_ARTIFACT)) {
            $entry = $artifacts | Where-Object name -eq $artifact | Select-Object -First 1
            if (-not $entry) {
              throw "Workflow artifact $artifact was not found"
            }
            $archive = Join-Path $env:RUNNER_TEMP ($artifact + '.zip')
            $downloaded = $false
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              & curl.exe --silent --show-error --fail --location --connect-timeout 20 --speed-limit 1024 --speed-time 60 --continue-at - --output $archive --retry 3 --retry-all-errors --retry-delay 5 @headers "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($entry.id)/zip"
              if ($LASTEXITCODE -eq 0) {
                $downloaded = $true
                break
              }
              if ($attempt -lt 6) {
                $delay = [Math]::Min(60, 5 * [Math]::Pow(2, $attempt - 1))
                Write-Warning "Artifact $artifact download attempt $attempt failed; retrying in $delay seconds"
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $downloaded) {
              throw "Unable to download artifact $artifact after 6 attempts"
            }
            Expand-Archive -LiteralPath $archive -DestinationPath release -Force
            Remove-Item -LiteralPath $archive -Force
          }
      - env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          EXE: ${{ matrix.exe }}
          FW: ${{ matrix.fw }}
          PLATFORM: ${{ matrix.platform }}
        shell: python
        run: |
          import os,pathlib,subprocess
          exe=pathlib.Path('release')/os.environ['EXE']; exe.chmod(0o755)
          with open('release/smoke-'+os.environ['PLATFORM']+'.log','w') as log:
              subprocess.run(['python','scripts/smoke.py','--msb',str(exe),'--firmware','release/'+os.environ['FW'],'--image','release/kali-core-'+os.environ['ARCH']+'.tar','--image-ref','kali-mcp-sandbox:'+os.environ['VERSION']+'-'+os.environ['ARCH'],'--service','release/guest-service.py'],stdout=log,stderr=subprocess.STDOUT,check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.platform }}
          path: release/smoke-*.log
  publish:
    needs: vm
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: python -m pip install .
      - name: Build standalone launcher wheel
        run: python -m pip wheel --no-deps . --wheel-dir release
      - name: Publish verified OCI image to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="${GITHUB_REPOSITORY,,}"
          for archive in release/kali-core-*.tar; do
            arch="${archive##*kali-core-}"
            arch="${arch%.tar}"
            docker load --input "$archive"
            docker tag "kali-mcp-sandbox:$VERSION-$arch" "ghcr.io/$repository:$VERSION-$arch"
            docker tag "kali-mcp-sandbox:$VERSION-$arch" "ghcr.io/$repository:latest-$arch"
            docker push "ghcr.io/$repository:$VERSION-$arch"
            docker push "ghcr.io/$repository:latest-$arch"
          done
      - name: Sign and publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          KALI_SIGNING_SEED: ${{ secrets.KALI_SIGNING_SEED }}
          KALI_PUBLIC_KEY: ${{ vars.KALI_PUBLIC_KEY }}
          VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          REPOSITORY: ${{ github.repository }}
        shell: python
        run: |
          import os,json,subprocess,pathlib
          channel=json.loads(pathlib.Path('kali_mcp_sandbox/channel.json').read_text())
          assert channel['publicKey']==os.environ['KALI_PUBLIC_KEY'].strip()
          v=os.environ['VERSION']; repo=os.environ['REPOSITORY']
          import tomllib
          assert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']==v, 'Bump package version before release'
          tag='v'+v
          # Never bind a new build to an existing tag pointing at different source.
          ref=subprocess.run(['gh','api',f'repos/{repo}/git/ref/tags/{tag}'],capture_output=True,text=True)
          if ref.returncode==0:
              assert json.loads(ref.stdout)['object']['sha']==os.environ['GITHUB_SHA'], 'Tag points at different source'
          if subprocess.run(['gh','release','view',tag,'--repo',repo],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
              raise SystemExit('Release already exists; choose a new version')
          selected=json.loads(os.environ['PLATFORMS'])
          subprocess.run(['python','scripts/release.py','manifest','--output','release','--version',v,'--base-url',f'https://github.com/{repo}/releases/download/{tag}',*[x for p in selected for x in ('--platform',p)]],check=True)
          notes='Verified platforms: '+', '.join(selected)+'. Includes the root-by-default internal network toolchain (OpenVPN, SMB/Impacket, ProxyChains, NetExec and related clients), signed runtime assets, package inventory and real-hypervisor smoke evidence. Existing sandbox disks are never overwritten by installation.'
          subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',os.environ['GITHUB_SHA'],'--draft','--title','Kali MCP Sandbox '+v,'--notes',notes,*[str(p) for p in pathlib.Path('release').iterdir()]],check=True)
          subprocess.run(['gh','release','edit',tag,'--repo',repo,'--draft=false','--latest'],check=True)
